<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zeeshan Amjid - Champions Community</title>
<meta name="description" content="Zeeshan Amjid ki official Champions Community website. First Trail Class Community">
<meta name="keywords" content="Zeeshan Amjid, First Trail, Champions, Zeeshan Amjid website">
<meta name="author" content="Zeeshan Amjid">
<link rel="stylesheet" href="style.css">

<!-- 1. Pehle Supabase Library -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<!-- 2. Phir Supabase Config -->
<script>
  const SUPABASE_URL = 'https://bhozzxzgrxendoypnyevo.supabase.co';
  // YAHAN APNI REAL ANON KEY PASTE KARO - Supabase > Project Settings > API Keys > anon public
  const SUPABASE_ANON_KEY = 'PASTE_YOUR_REAL_ANON_KEY_HERE';
  const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
</script>
</head>
<body>
  <div class="ambient ambient-one"></div>
  <div class="ambient ambient-two"></div>

  <header class="topbar">
    <div class="logo">CHAMPIONS - CLASS COMMUNITY</div>
    <button id="setupStatusBtn">Setup status</button>
  </header>

  <main>
    <section id="hero">
      <p>YOUR CLASS. YOUR SPACE.</p>
      <h1>Make memories<br>Be a Champion.</h1>
      <p>A fun shared space for class voting, daily feedback, photos, poetry and friendly messages.</p>
      <button onclick="document.getElementById('vote').scrollIntoView()">Explore the fun</button>
    </section>

    <!-- VOTING SECTION -->
    <section id="vote">
      <h2>Vote Your Champion</h2>
      <div id="championsList">Loading champions...</div>
    </section>

    <!-- MESSAGES SECTION -->
    <section id="messages">
      <h2>Community Wall</h2>
      <input type="text" id="msgInput" placeholder="Apna message likho...">
      <button id="sendMsgBtn">Send Message</button>
      <div id="messagesList"></div>
    </section>
  </main>

  <footer>Made for your class community</footer>

  <dialog id="infoDialog"></dialog>

  <!-- 3. Sabse Akhir me Aapki Script -->
  <script src="script.js"></script>
  <script>
    // Voting aur Messaging ka working code
    async function loadChampions() {
      const { data, error } = await supabaseClient.from('champions').select('*');
      if (error) { console.log(error); return; }
      const list = document.getElementById('championsList');
      list.innerHTML = '';
      data.forEach(c => {
        list.innerHTML += `<div class="champ-card"><b>${c.name}</b> - Score: ${c.score} <button onclick="doVote(${c.id}, ${c.score})">Vote</button></div>`;
      });
    }

    async function doVote(id, currentScore) {
      const { error } = await supabaseClient.from('champions').update({ score: currentScore + 1 }).eq('id', id);
      if (!error) { alert('Vote ho gaya!'); loadChampions(); }
    }

    async function loadMessages() {
      const { data } = await supabaseClient.from('chat_messages').select('*').order('created_at', { ascending: false }).limit(20);
      const list = document.getElementById('messagesList');
      list.innerHTML = '';
      data?.forEach(m => {
        list.innerHTML += `<div class="msg">${m.message}</div>`;
      });
    }

    const sendBtn = document.getElementById('sendMsgBtn');
    if (sendBtn) {
      sendBtn.addEventListener('click', async () => {
        const input = document.getElementById('msgInput');
        if (!input.value) return;
        await supabaseClient.from('chat_messages').insert([{ message: input.value }]);
        input.value = '';
        loadMessages();
      });
    }

    // Load on start
    loadChampions();
    loadMessages();
  </script>
</body>
</html>
